name: steward
version: "1.0.0"
manifest_version: 2
api_version: 1
description: "Your chief of staff in the team chat. Collects every department's weekly update in its own group (voice note in any language, text, photo or file), chases only the teams that haven't replied, and gives the founder one weekly pack with promised-vs-done, a stuck radar, numbers and a 60-second voice brief. The founder replies 'send' and the staff version goes to everyone."
author: "imprint-hash"
license: MIT
homepage: https://github.com/imprint-hash/steward
requires_hermes: ">=0.23.0"
tags: [team, reports, weekly, whatsapp, small-business, voice, chief-of-staff]
provides_tools:
  - steward_setup
  - steward_checkin
  - steward_read_file
  - steward_record_report
  - steward_status
  - steward_build_pack
  - steward_publish
provides_hooks: []
provides_middleware: []
requires_env: []
python_dependencies: []
